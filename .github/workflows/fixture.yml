# Builds the self-written triangle fixture with MinGW and reports which of its imports Anyxbox covers.
# Read-only: no secrets, no pushes, no third-party binaries. The exe is an artifact of our own tests/fixtures/triangle.c.
name: fixture
on:
  push:
    paths: ['tests/fixtures/**', 'src/**', 'tools/**', '.github/workflows/fixture.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triangle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 (Ubuntu package)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 g++ gdb xvfb libsdl2-2.0-0 mesa-vulkan-drivers libvulkan1
      - name: Build the Windows fixture
        run: |
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -ffreestanding -fno-builtin -fno-stack-protector -fno-asynchronous-unwind-tables \
            -nostdlib -nostartfiles -Wl,-e,mainEntry -Itests/fixtures \
            -o triangle.exe tests/fixtures/triangle.c -lkernel32 -luser32 -ld3d11
          ls -l triangle.exe
          x86_64-w64-mingw32-objdump -p triangle.exe | sed -n '/DLL Name/p;/Entry point/p' || true
      - name: Build the scene fixture (depth, index buffer, dynamic constant buffer, texture)
        run: |
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -ffreestanding -fno-builtin -fno-stack-protector -fno-asynchronous-unwind-tables \
            -nostdlib -nostartfiles -Wl,-e,mainEntry -Itests/fixtures \
            -o scene.exe tests/fixtures/scene.c -lkernel32 -luser32 -ld3d11
          ls -l scene.exe
          x86_64-w64-mingw32-objdump -p scene.exe | sed -n '/DLL Name/p;/Entry point/p' || true
      - name: Build the C runtime fixture (default MinGW startup)
        run: |
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -o hello_crt.exe tests/fixtures/hello_crt.c
          ls -l hello_crt.exe
          x86_64-w64-mingw32-objdump -p hello_crt.exe | sed -n '/DLL Name/p'
      - name: Build the TLS fixture (default MinGW startup, __thread data)
        run: |
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -o tls_crt.exe tests/fixtures/tls_crt.c
          ls -l tls_crt.exe
          x86_64-w64-mingw32-objdump -p tls_crt.exe | sed -n '/DLL Name/p;/^Entry/p' || true
          x86_64-w64-mingw32-objdump -p tls_crt.exe | grep -i -E "TLS Directory|tls" | head || true
      - name: Build the thread TLS fixture
        run: |
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -o tls_thread.exe tests/fixtures/tls_thread.c
      - name: Build the C++ exception fixture (static libstdc++/libgcc, throw and catch)
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -O1 -static -o eh.exe tests/fixtures/eh.cpp
          ls -l eh.exe
          x86_64-w64-mingw32-objdump -p eh.exe | sed -n '/DLL Name/p;/^Entry/p' || true
      - name: Build the vectored handler fixture
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -O1 -static -o veh.exe tests/fixtures/veh.cpp
          ls -l veh.exe
          x86_64-w64-mingw32-objdump -p veh.exe | sed -n '/DLL Name/p;/^Entry/p' || true
      - name: Build the draw-copy fixture
        run: |
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -ffreestanding -fno-builtin -fno-stack-protector -fno-asynchronous-unwind-tables \
            -nostdlib -nostartfiles -Wl,-e,mainEntry -Itests/fixtures \
            -o draw_copy.exe tests/fixtures/draw_copy.c -lkernel32 -luser32 -ld3d11
      - name: Build independent region-update-map draw variants
        run: |
          for method in region update map; do
            x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -ffreestanding -fno-builtin -fno-stack-protector -fno-asynchronous-unwind-tables \
              -nostdlib -nostartfiles -Wl,-e,mainEntry -Itests/fixtures \
              -o draw_${method}.exe tests/fixtures/draw_${method}.c -lkernel32 -luser32 -ld3d11
          done
      - name: Build the rooted asset fixture
        run: |
          x86_64-w64-mingw32-gcc -std=gnu11 -O2 -Wall -Wextra -ffreestanding -fno-builtin -fno-stack-protector -nostdlib -nostartfiles -Wl,-e,mainEntry -o asset_read.exe tests/fixtures/asset_read.c -lkernel32
      - name: Build the texture-copy fixture
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -O1 -static -Wall -Wextra -o texture_copy.exe tests/fixtures/texture_copy.cpp -ld3d11
      - name: Build the Anyxbox tools (Linux)
        run: |
          mkdir -p obj
          # explicit list: the tree also holds files from the AnyPS5 import that no target builds (for example src/syslayer/services.cpp)
          for f in src/gfx/d3d11_model.cpp src/gfx/d3d11_vulkan.cpp src/gfx/render.cpp src/gfx/vulkan.cpp src/loader/pe_header.cpp src/loader/pe_image.cpp src/loader/pe_report.cpp src/runtime/d3d11_runtime.cpp src/runtime/devices.cpp src/runtime/host_window.cpp src/runtime/kernel32.cpp src/runtime/msvcrt.cpp src/runtime/run_pe.cpp src/runtime/seh.cpp src/runtime/teb.cpp src/runtime/user32.cpp src/shader/dxbc.cpp src/shader/dxbc_spirv.cpp src/syslayer/import_registry.cpp src/syslayer/win32_file.cpp src/syslayer/win32_memory.cpp src/syslayer/win32_sync.cpp src/syslayer/win32_thread.cpp; do
            g++ -std=c++17 -O1 -Isrc -c "$f" -o "obj/$(echo "$f" | tr / _).o"
          done
          g++ -std=c++17 -O1 -Isrc tools/import_gap.cpp obj/*.o -ldl -lpthread -o import_gap
          g++ -std=c++17 -O1 -g -Isrc tools/run_exe.cpp obj/*.o -ldl -lpthread -o run_exe
      - name: Run every unit test and the committed-fixture checks (strict, fails the job)
        run: |
          mkdir -p tbin
          fail=0
          for t in tests/test_*.cpp; do
            n=$(basename "$t" .cpp)
            g++ -std=c++17 -O1 -Isrc -Itests -Itests/fixtures "$t" obj/*.o -ldl -lpthread -o "tbin/$n" || { echo "BUILD FAIL $n"; fail=1; continue; }
            if xvfb-run -a "tbin/$n" tests/fixtures > "tbin/$n.log" 2>&1; then echo "pass $n"; else echo "FAIL $n"; cat "tbin/$n.log"; fail=1; fi
          done
          exit $fail
      - name: Stack-protected hardware exception regression (strict)
        run: |
          g++ -std=c++17 -O1 -g -fstack-protector-all -Isrc -c src/runtime/seh.cpp -o obj/seh-protected.o
          objs=$(find obj -name '*.o' ! -name 'src_runtime_seh.cpp.o' ! -name 'seh-protected.o')
          g++ -std=c++17 -O1 -g -fstack-protector-all -Isrc -Itests tests/test_seh.cpp obj/seh-protected.o $objs -ldl -lpthread -o tbin/test_seh_protected
          ./tbin/test_seh_protected > tbin/test_seh_protected.log 2>&1
          rm obj/seh-protected.o
      - name: Upload unit-test logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: tbin/*.log
      - name: Import coverage of the real exe
        run: ./import_gap triangle.exe || true
      - name: Import coverage of the scene fixture
        run: ./import_gap scene.exe || true
      - name: Import coverage and run of the TLS fixture
        run: |
          ./import_gap tls_crt.exe || true
          ./run_exe --i-built-this tls_crt.exe || true
      - name: Import coverage and run of the thread TLS fixture
        run: |
          ./import_gap tls_thread.exe
          ./run_exe --i-built-this tls_thread.exe
      - name: Import coverage and run of the C++ exception fixture
        run: |
          ./import_gap eh.exe || true
          ./run_exe --i-built-this eh.exe || true
          ANYXBOX_SEH_TRACE=1 ./run_exe --i-built-this eh.exe 2>&1 | head -80 || true
          gdb -batch -ex run -ex bt -ex 'info registers rip rsp rax rcx rdx' -ex 'x/10i $rip-12' --args ./run_exe --i-built-this eh.exe 2>&1 | head -60 || true
      - name: Import coverage and run of the vectored handler fixture
        run: |
          ./import_gap veh.exe || true
          ./run_exe --i-built-this veh.exe || true
          ANYXBOX_SEH_TRACE=1 ./run_exe --i-built-this veh.exe 2>&1 | head -40 || true
      - name: Verify independently compiled draw-copy frames (strict Vulkan required)
        run: |
          ./import_gap draw_copy.exe
          ./tbin/test_fixture_draw_copy draw_copy.exe --require-vulkan draw-copy-frame
          ./tbin/test_fixture_draw_copy tests/fixtures/draw_copy.run.exe --require-vulkan committed-draw-copy-frame
      - name: Verify independent region-update-map draw variants (strict Vulkan required)
        run: |
          for method in region update map; do
            ./import_gap draw_${method}.exe
            ./tbin/test_fixture_draw_${method} draw_${method}.exe --require-vulkan draw-${method}-frame
            ./tbin/test_fixture_draw_${method} tests/fixtures/draw_${method}.run.exe --require-vulkan committed-draw-${method}-frame
          done
      - name: Run independent file-backed launcher fixture (strict)
        run: |
          mkdir -p test-assets/data
          printf 'Anyxbox rooted asset\n' > test-assets/data/message.txt
          ./import_gap asset_read.exe
          ./run_exe --i-built-this asset_read.exe --asset-root test-assets > asset-read.log
          cat asset-read.log
          grep -q 'loaded=1 ran=1 exit=0' asset-read.log
          grep -q 'output: Anyxbox rooted asset' asset-read.log
          test "$(cat test-assets/data/message.txt)" = 'Anyxbox rooted asset'
          if ./run_exe --i-built-this asset_read.exe > asset-read-denied.log; then cat asset-read-denied.log; exit 1; fi
          cat asset-read-denied.log
          grep -q 'exit=10' asset-read-denied.log
          ./run_exe --i-built-this tests/fixtures/asset_read.run.exe --asset-root test-assets > committed-asset-read.log
          cat committed-asset-read.log
          grep -q 'loaded=1 ran=1 exit=0' committed-asset-read.log
          grep -q 'output: Anyxbox rooted asset' committed-asset-read.log
          if ./run_exe --i-built-this tests/fixtures/asset_read.run.exe > committed-asset-read-denied.log; then cat committed-asset-read-denied.log; exit 1; fi
          cat committed-asset-read-denied.log
          grep -q 'exit=10' committed-asset-read-denied.log
          test "$(cat test-assets/data/message.txt)" = 'Anyxbox rooted asset' 
      - name: Run separately compiled texture-copy fixture (strict)
        run: |
          ./import_gap texture_copy.exe
          ./run_exe --i-built-this texture_copy.exe
      - name: Import coverage of the C runtime fixture
        run: ./import_gap hello_crt.exe || true
      - name: Run the C runtime fixture
        run: ./run_exe --i-built-this hello_crt.exe || true
      - name: Debug the C runtime fixture run (backtrace, registers, code at the fault)
        run: |
          x86_64-w64-mingw32-objdump -p hello_crt.exe | grep -E "ImageBase|AddressOfEntryPoint|SizeOfImage" || true
          x86_64-w64-mingw32-objdump -p hello_crt.exe | sed -n '/The Data Directory/,/^$/p' | head -20 || true
          gdb -batch -ex run -ex bt -ex 'info registers rip rsp rax rcx rdx' -ex 'x/10i $rip-12' -ex 'info proc mappings' --args ./run_exe --i-built-this hello_crt.exe 2>&1 | head -120 || true
      - name: Disassemble the C runtime fixture entry (first 60 instructions)
        run: x86_64-w64-mingw32-objdump -d -M intel hello_crt.exe | sed -n '1,90p' || true
      - name: Run the exe headless through Anyxbox
        run: ./run_exe --i-built-this triangle.exe || true
      - name: Run the scene exe through Anyxbox with the software Vulkan driver
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 || true
          ./run_exe --i-built-this scene.exe || true
          ./run_exe --i-built-this scene.exe --gpu --save-frame scene.png || true
          ./run_exe --i-built-this triangle.exe --gpu --save-frame triangle.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-exes
          path: |
            asset_read.exe
            asset-read*.log
            committed-asset-read*.log
            draw_region.exe
            draw_update.exe
            draw_map.exe
            committed-draw-region-frame*.ppm
            committed-draw-update-frame*.ppm
            committed-draw-map-frame*.ppm
            draw-region-frame*.ppm
            draw-update-frame*.ppm
            draw-map-frame*.ppm
            draw_copy.exe
            draw-copy-frame*.ppm
            committed-draw-copy-frame*.ppm
            texture_copy.exe
            triangle.exe
            hello_crt.exe
            tls_crt.exe
            tls_thread.exe
            eh.exe
            veh.exe
            scene.exe
            scene.png
            triangle.png
